name: Lean 4 Kernel Verify, Axiom Audit, PR Bot & Deploy Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "proofchain-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  lean4-verify-and-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Save base ledger for PR Credit Delta
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:ledger/ledger.json" > /tmp/base_ledger.json || true

      - name: Install Lean 4 (elan + lake), fetch Mathlib cache & run `lake build`
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Run Real Lean 4 Kernel `#print axioms` Audit
        run: |
          python3 protocol/verifier/verify_axioms.py --markdown | tee /tmp/axioms_report.md

      - name: Rebuild Cryptographic Ledger with Kernel Attestations
        run: |
          python3 protocol/verifier/build_ledger.py
          python3 agents/example_agent.py

      - name: Generate PR Bot Verification & Credit Settlement Report
        if: github.event_name == 'pull_request'
        run: |
          if [ -s /tmp/base_ledger.json ]; then
            python3 protocol/verifier/bot_handler.py pr-report --base-ledger /tmp/base_ledger.json --out /tmp/pr_comment.md
          else
            python3 protocol/verifier/bot_handler.py pr-report --out /tmp/pr_comment.md
          fi

      - name: Post / Update PR Bot Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr_comment.md', 'utf8');
            const marker = '<!-- proofchain-pr-bot -->';
            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Verify Ledger Integrity & Kernel Attestation
        run: |
          python3 -c '
          import json
          ledger = json.load(open("ledger/ledger.json"))
          assert ledger["stats"]["total_problems"] >= 4
          assert ledger["kernel_attestation"]["all_passed"] is True
          print("Kernel-attested ledger verified! Toolchain:", ledger["lean_toolchain"])
          print("Chain tip:", ledger["stats"]["chain_tip"][:22])
          '

      - name: Upload Kernel-Attested GitHub Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: lean4-verify-and-score
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
